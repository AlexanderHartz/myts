;;; myts configuration.
;;; Settings for the terminal, input devices and font.
;;; Key definitions are included from keydefs.ini.

[Settings]
    ; terminal key configuration
    TermEnd = Right<
    TermEsc = Right>
    TermCtrl = aA
    TermSym = Back ; hold Back + key to type symbols
    TermShift = Shift
    TermFn = Menu
    TermLang = Sym ; change to Back if you want Sym as the symbol modifier
    TermHome = Home
    TermScrollup = Left<
    TermScrolldown = Left>

;; Symbols maps TermSym + one of the 28 keys, in this order:
;;   q w e r t y u i o p
;;   a s d f g h j k l D
;;   z x c v b n m .
;; It must contain exactly one character per key (28 total).
    Symbols = !@#$%^&*()'+#-_()&!?~$|/\"':

    RefreshDelay = 50
    #KpadIn = /dev/stdin
    KpadIn = /dev/input/event0
    FwIn = /dev/input/event1
    VolIn = /dev/input/event2
    KpadOut = /proc/keypad
    FwOut = /proc/fiveway
    VolOut = /proc/volume
    SpecialIn = /var/tmp/myts.special

    include = keydefs.ini
    Font = ter-u12n.hex
    Encoding = UTF8
    FontHeight = 12
    FontWidth = 6
    XOffset = 4
    YOffset = 4
    
    ScrollbackLines = 1000
    LangSymbols = �.��������������������������
    LangSymbols16 = .ץקראטוןםפשדגכעיחלךףזסבהנמצת
