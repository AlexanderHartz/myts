;;; Input key definitions for myts on Kindle 3.
;;; Definitions are of the form Code = Name ....
;;; CODE is a number optionally preceded by s, f, v to indicate
;;; that the corresponding names on the right are meant to be sent
;;; with sendshift (s), or on /proc/fiveway (f) or /proc/volume (v).
;;; In case of multiple names, codes are assigned sequentially.
;;; NAME is the symbolic name of the key used by myts.ini.
;;; Single-char names correspond to ascii chars and are case sensitive.
;;; Other names are case insensitive.
;;; Use \\ to protect special chars (space, ; and #).

[INKEYS]
; generic codes, for all platforms
2	= 1 2 3 4 5 6 7 8 9 0	; Alt + qwerty row 1 -> 1..0 on Kindle 3
16	= q w e r t y u i o p	; row 1
30	= a s d f g h j k l	; row 2
44	= z x c v b n m		; row 3
52	= .
14	= Del
28	= Enter
42	= Shift
; alt pressure and release is only reported after the next keypress
56	= Alt
57	= Space
139	= Menu

; Kindle 3 keys (active)
126	= Sym
190	= aA
102	= Home
158	= Back
193	= Left<
104	= Left>
109	= Right<
191	= Right>
f103	= Up
f108	= Down
f105	= Left
f106	= Right
f194	= Select
v114	= Vol-
v115	= Vol+

; Kindle DX Graphite keys (kept for reference, not used by this build)
;53	= /
;90	= Aa
;94	= Sym
;98	= Home
;91	= Back
;109	= Right<
;124	= Right>
;f105	= Left
;f106	= Right
;f122	= Up
;f123	= Down
;f92	= Select
;v114	= Vol-
;v115	= Vol+

; Legacy symbol rows. They are not used by the current symbol modifier,
; which is driven by the Symbols string in myts.ini.
[inkeys-dx]
ROW0	= \" '  @  -  +  *  ^  (  )  <  >
ROW1	= ?  ,  !  /  =  #  |  {  }  `  ~
ROW2	= &  :  .  \;  _  %  $  [  ]  \\

[inkeys-k3]
ROW0	= :  <  >  \" ?  {  }  |  `  ~  GBp  Euro
ROW1	= \; ,  .  '  /  [  ]  \\  oQ cQ ~!   ~?
ROW2	= !  @  #  $  %  ^  &  *  (  )  _    +
ROW3	= 1  2  3  4  5  6  7  8  9  0  -    =
